blueprint:
  name: Anker SOLIX Solarbank 4 — Surplus Solare (DinamoTech)
  description: >-
    Sfrutta il surplus solare della tua Solarbank 4: quando la batteria è
    carica e c'è margine di potenza, l'energia in eccesso scalda l'acqua
    sanitaria o ricarica una power station, e tutto torna a riposo quando
    il sole non copre più il carico. Richiede l'integrazione ufficiale
    "Anker SOLIX Official" (Modbus TCP locale).

    Configurazione in 3 passi: scegli i 3 sensori della Solarbank,
    rispondi alle due domande, apri SOLO la sezione della modalità scelta.
    Le altre sezioni hanno già default sensati: aprile solo se vuoi
    regolare qualcosa.

    Include: watchdog sensori non disponibili, blocco con avviso se la
    potenza erogabile è insufficiente, spegnimento a power station carica,
    soglia di sicurezza sul prelievo dalla rete.

    Guida completa: github.com/DinamoTechIT/ha-blueprints

    Creato da DinamoTech — dinamotech.it
  domain: automation
  input:
    # ================= SORGENTE: SOLARBANK 4 =================
    sezione_sorgente:
      name: Sorgente — Anker Solarbank 4
      icon: mdi:solar-power
      description: I sensori della tua Solarbank 4 (integrazione Anker SOLIX Official)
      input:
        sensore_soc:
          name: Sensore SOC batteria
          description: Il sensore "SOC" della tua Solarbank 4
          selector:
            entity:
              integration: anker_solix_official
              domain: sensor
        sensore_pv:
          name: Sensore produzione solare
          description: Il sensore "Solar Power" della tua Solarbank 4
          selector:
            entity:
              integration: anker_solix_official
              domain: sensor
        sensore_carico:
          name: Sensore consumo di casa
          description: Il sensore "Home Load" della tua Solarbank 4
          selector:
            entity:
              integration: anker_solix_official
              domain: sensor

    # ================= COSA FARE COL SURPLUS =================
    scelta_surplus:
      name: Cosa vuoi fare con l'energia in eccesso?
      description: >-
        Scegli la destinazione del surplus solare, poi compila SOLO la
        sezione corrispondente qui sotto.
      default: acqua_calda
      selector:
        select:
          options:
            - label: "Ricaricare una power station"
              value: power_station
            - label: "Scaldare l'acqua calda sanitaria"
              value: acqua_calda
    p_carico:
      name: Potenza del carico da alimentare
      description: |-
        Quanto assorbe il carico quando è acceso, in base alla modalità scelta:

        - **Acqua calda con setpoint** → la potenza elettrica della pompa di calore durante il boost ACS
        - **Acqua calda con resistenza** → la potenza della resistenza
        - **Power station** → la potenza di ricarica del caricatore (molte power station permettono di limitarla dall'app: impostala e inserisci qui lo stesso valore)
      default: 1500
      selector:
        number:
          min: 0
          max: 2500
          step: 50
          unit_of_measurement: W

    # ================= CONFIG ACQUA CALDA =================
    sezione_acs:
      name: Configurazione Acqua Calda
      icon: mdi:water-boiler
      collapsed: true
      description: >-
        Compila SOLO se hai scelto "Scaldare l'acqua calda sanitaria".
        Se hai scelto la power station, salta questa sezione.
      input:
        tipo_acs:
          name: Che tipo di sistema hai?
          description: >-
            Il tuo sistema di acqua calda consente di regolare la temperatura
            da Home Assistant (pompa di calore o boiler smart integrato),
            oppure funziona con la semplice accensione di una resistenza
            elettrica / boiler elettrico tramite relè? In base alla risposta,
            qui sotto compila SOLO i campi [Setpoint] oppure SOLO quelli
            [Resistenza].
          default: setpoint
          selector:
            select:
              options:
                - label: "[Setpoint] Temperatura regolabile da Home Assistant"
                  value: setpoint
                - label: "[Resistenza] Semplice accensione resistenza / boiler elettrico via relè"
                  value: rele
        entita_setpoint:
          name: "[Setpoint] Entità acqua calda"
          description: >-
            Solo se sopra hai scelto [Setpoint]: l'entità water_heater o
            climate del tuo sistema ACS (es. water_heater.altherma di
            Daikin Onecta)
          default: ""
          selector:
            entity:
              domain:
                - water_heater
                - climate
        temp_surplus:
          name: "[Setpoint] Temperatura con surplus"
          description: >-
            Solo se sopra hai scelto [Setpoint]: la temperatura dell'acqua
            quando c'è surplus solare da sfruttare
          default: 55
          selector:
            number:
              min: 40
              max: 70
              unit_of_measurement: "°C"
        temp_standard:
          name: "[Setpoint] Temperatura standard"
          description: >-
            Solo se sopra hai scelto [Setpoint]: la temperatura normale,
            ripristinata quando il surplus finisce
          default: 45
          selector:
            number:
              min: 30
              max: 60
              unit_of_measurement: "°C"
        entita_rele_acs:
          name: "[Resistenza] Relè della resistenza"
          description: >-
            Solo se sopra hai scelto [Resistenza]: l'entità switch del relè
            smart che alimenta la resistenza (es. uno Shelly — per il
            collegamento vedi la Guida Smart Grid)
          default: ""
          selector:
            entity:
              domain: switch

    # ================= CONFIG POWER STATION =================
    sezione_ps:
      name: Configurazione Power Station
      icon: mdi:battery-charging
      collapsed: true
      description: >-
        Compila SOLO se hai scelto "Ricaricare una power station".
        Se hai scelto l'acqua calda, salta questa sezione. L'unico campo
        indispensabile è il relè: gli altri servono solo per lo
        spegnimento automatico a ricarica completata.
      input:
        controllo_ps:
          name: Come vuoi controllare la ricarica?
          description: >-
            Con una presa smart o un relè comandati dal blueprint, oppure
            — in futuro — collegando il caricatore alla presa di backup
            della Solarbank. Il controllo della presa di backup non è
            ancora possibile dall'integrazione ufficiale: l'opzione è già
            qui per quando lo sarà. ⚠️ Per usare la presa di backup la
            Solarbank dovrà essere impostata in modalità "Controllo di
            terze parti".
          default: smart_plug
          selector:
            select:
              options:
                - label: "Smart plug o relè smart (es. Shelly)"
                  value: smart_plug
                - label: "Presa di backup della Solarbank — NON ANCORA DISPONIBILE"
                  value: presa_backup
        entita_rele_ps:
          name: Relè / smart plug del caricatore
          description: >-
            L'entità switch della presa smart o del relè a cui è collegato
            il caricatore della power station
          default: ""
          selector:
            entity:
              domain: switch
        sensore_potenza_ps:
          name: Sensore della potenza assorbita (facoltativo)
          description: >-
            La misura di potenza della presa smart o del relè con power
            monitoring che alimenta il caricatore. Se configurato, quando
            la power station finisce di caricarsi la presa viene spenta
            invece di restare alimentata a vuoto; i due campi qui sotto
            regolano questo comportamento. Se lasciato vuoto, la presa
            resta alimentata fino a fine surplus (nessun danno).
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: power
        soglia_potenza_ps:
          name: Potenza minima di ricarica (facoltativo)
          description: >-
            Serve solo se hai configurato il sensore qui sopra, altrimenti
            viene ignorato: sotto questa potenza la power station è
            considerata carica (il caricatore in standby assorbe solo
            pochi watt).
          default: 25
          selector:
            number:
              min: 5
              max: 200
              step: 5
              unit_of_measurement: W
        minuti_ps_piena:
          name: Durata sotto soglia (facoltativo)
          description: >-
            Serve solo se hai configurato il sensore qui sopra, altrimenti
            viene ignorato: per quanti minuti la potenza deve restare sotto
            la soglia prima di spegnere la presa. Copre anche la rampa
            iniziale di ricarica.
          default: 10
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: min

    # ================= AVANZATE =================
    sezione_avanzate:
      name: Avanzate
      icon: mdi:cog-outline
      collapsed: true
      description: >-
        Per gli smanettoni. I default vanno bene per la maggior parte
        degli impianti: apri solo se sai cosa stai cercando.
      input:
        p_max_manuale:
          name: Potenza massima erogabile
          description: >-
            Il limite di scarica della tua Solarbank (es. 2500 W per la
            Solarbank 4 E5000 Pro). Abbassalo se nell'app Anker hai
            impostato un limite di uscita (es. modalità 800 W).
          default: 2500
          selector:
            number:
              min: 300
              max: 2500
              step: 100
              unit_of_measurement: W
        sensore_pv_extra:
          name: Fotovoltaico di terze parti (facoltativo)
          description: >-
            Se hai un secondo impianto PV monitorato in Home Assistant
            (anche non Anker), la sua produzione viene sommata a quella
            principale.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: power

    # ================= SOGLIE E SICUREZZA =================
    sezione_soglie:
      name: Soglie e sicurezza
      icon: mdi:tune
      collapsed: true
      description: >-
        Va bene così com'è: apri solo se vuoi regolare soglie, ritardi
        o la protezione sul prelievo dalla rete.
      input:
        soglia_soc_on:
          name: SOC di attivazione
          description: >-
            Il carico parte solo quando la batteria della Solarbank supera
            questa carica: sotto, il sole serve prima a riempire la
            batteria. È il tuo "surplus disponibile".
          default: 95
          selector:
            number:
              min: 50
              max: 100
              unit_of_measurement: "%"
        soglia_soc_off:
          name: SOC minimo di mantenimento
          default: 50
          description: >-
            Una volta partito, il carico resta acceso anche se la batteria
            scende sotto il SOC di attivazione — ma se arriva fin sotto
            questa soglia viene spento: significa che stai attingendo
            troppo dall'accumulo.
          selector:
            number:
              min: 5
              max: 95
              unit_of_measurement: "%"
        ritardo_on:
          name: Stabilità per attivazione (minuti)
          description: >-
            Le condizioni di attivazione devono restare vere per questi
            minuti prima di accendere il carico: evita partenze inutili
            per un picco di sole o un calo momentaneo dei consumi.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: min
        ritardo_off:
          name: Stabilità per disattivazione (minuti)
          description: >-
            Le condizioni di spegnimento devono restare vere per questi
            minuti prima di spegnere il carico: una nuvola di passaggio
            non interrompe il funzionamento.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: min
        sensore_prelievo:
          name: Sensore prelievo dalla rete
          description: >-
            Il sensore "Grid Import Power" della tua Solarbank 4. Se
            configurato, il carico viene spento quando il prelievo dalla
            rete supera la soglia sotto per 5 minuti.
          default: ""
          selector:
            entity:
              integration: anker_solix_official
              domain: sensor
        soglia_prelievo:
          name: Prelievo massimo tollerato
          default: 300
          selector:
            number:
              min: 50
              max: 2000
              step: 50
              unit_of_measurement: W

mode: single
max_exceeded: silent

trigger_variables:
  tv_soc: !input sensore_soc
  tv_pv: !input sensore_pv
  tv_pv_extra: !input sensore_pv_extra
  tv_carico: !input sensore_carico
  tv_p_max_man: !input p_max_manuale
  tv_p_carico: !input p_carico
  tv_soc_on: !input soglia_soc_on
  tv_soc_off: !input soglia_soc_off
  tv_prelievo_ent: !input sensore_prelievo
  tv_soglia_prelievo: !input soglia_prelievo
  tv_scelta: !input scelta_surplus
  tv_tipo_acs: !input tipo_acs
  tv_rele_ps: !input entita_rele_ps
  tv_rele_acs: !input entita_rele_acs
  tv_setpoint_ent: !input entita_setpoint
  tv_temp_surplus: !input temp_surplus
  tv_potenza_ps_ent: !input sensore_potenza_ps
  tv_soglia_potenza_ps: !input soglia_potenza_ps

triggers:
  # ===== ATTIVAZIONE =====
  # SOC alto E carico casa sotto il margine (P_max − P_carico).
  # Il template viene rivalutato ad ogni variazione dei sensori citati e
  # scatta al passaggio falso→vero: nessuna condizione resta "non ricontrollata".
  # Sensori non disponibili → default prudenti → il template resta falso.
  - trigger: template
    value_template: >-
      {% set soc = states(tv_soc) | float(0) %}
      {% set carico = states(tv_carico) | float(99999) %}
      {{ soc > tv_soc_on | float
         and carico < (tv_p_max_man | float - tv_p_carico | float) }}
    for:
      minutes: !input ritardo_on
    id: "on"

  # ===== DISATTIVAZIONE =====
  # SOC sotto il minimo OPPURE il sole non copre più il carico (con
  # tolleranza /1,2: accetti ~un sesto del carico dalla batteria pur di
  # non buttare in rete il resto del solare).
  # Valutata SOLO a carico attivo: in autoconsumo zero il PV è strozzato
  # sulla domanda di casa e il template sarebbe già vero prima
  # dell'attivazione — senza il gate non ci sarebbe mai la transizione
  # falso→vero e il trigger non scatterebbe. Così ogni attivazione
  # ri-arma il controllo. Stato attivo: relè acceso (modalità a relè)
  # o setpoint alla temperatura surplus (modalità ACS setpoint; se
  # l'attributo temperature non esiste, si assume attivo per prudenza).
  - trigger: template
    value_template: >-
      {% set modalita = 'power_station' if tv_scelta == 'power_station' else tv_tipo_acs %}
      {% if modalita == 'power_station' %}
        {% set attivo = tv_rele_ps != "" and is_state(tv_rele_ps, 'on') %}
      {% elif modalita == 'rele' %}
        {% set attivo = tv_rele_acs != "" and is_state(tv_rele_acs, 'on') %}
      {% else %}
        {% set t = state_attr(tv_setpoint_ent, 'temperature') if tv_setpoint_ent else none %}
        {% set attivo = t is none or t | float(0) >= tv_temp_surplus | float %}
      {% endif %}
      {% set soc = states(tv_soc) | float(0) %}
      {% set pv = states(tv_pv) | float(0) %}
      {% set pv2 = states(tv_pv_extra) | float(0) if tv_pv_extra else 0 %}
      {{ attivo
         and (soc < tv_soc_off | float
              or (pv + pv2) < (tv_p_carico | float / 1.2)) }}
    for:
      minutes: !input ritardo_off
    id: "off"

  # ===== SICUREZZA: prelievo dalla rete (solo se sensore configurato) =====
  # Stesso gate sul carico attivo, per lo stesso motivo del trigger sopra.
  - trigger: template
    value_template: >-
      {% set modalita = 'power_station' if tv_scelta == 'power_station' else tv_tipo_acs %}
      {% if modalita == 'power_station' %}
        {% set attivo = tv_rele_ps != "" and is_state(tv_rele_ps, 'on') %}
      {% elif modalita == 'rele' %}
        {% set attivo = tv_rele_acs != "" and is_state(tv_rele_acs, 'on') %}
      {% else %}
        {% set t = state_attr(tv_setpoint_ent, 'temperature') if tv_setpoint_ent else none %}
        {% set attivo = t is none or t | float(0) >= tv_temp_surplus | float %}
      {% endif %}
      {{ tv_prelievo_ent != ""
         and attivo
         and states(tv_prelievo_ent) | float(0) > tv_soglia_prelievo | float }}
    for:
      minutes: 5
    id: "prelievo"

  # ===== POWER STATION PIENA (solo se il sensore di potenza è configurato) =====
  # La presa è accesa ma il caricatore assorbe meno della soglia: la power
  # station ha finito di caricarsi. Sensore rotto → default alto (99999) →
  # il template resta falso e la presa non viene mai spenta per errore.
  - trigger: template
    value_template: >-
      {{ tv_scelta == 'power_station'
         and tv_potenza_ps_ent != ""
         and tv_rele_ps != ""
         and is_state(tv_rele_ps, 'on')
         and states(tv_potenza_ps_ent) | float(99999) < tv_soglia_potenza_ps | float }}
    for:
      minutes: !input minuti_ps_piena
    id: "ps_piena"

  # ===== TRAMONTO =====
  - trigger: sun
    event: sunset
    id: "tramonto"

  # ===== WATCHDOG: sensori essenziali non disponibili =====
  # Copre anche la caduta della connessione Modbus locale con la Solarbank.
  - trigger: state
    entity_id:
      - !input sensore_soc
      - !input sensore_pv
      - !input sensore_carico
    to:
      - "unavailable"
      - "unknown"
    for:
      minutes: 10
    id: "guasto"

variables:
  _p_max_attuale: !input p_max_manuale
  _p_carico: !input p_carico
  _scelta_surplus: !input scelta_surplus
  _tipo_acs: !input tipo_acs
  # Modalità effettiva derivata dalle due domande del form:
  # power_station, oppure (per l'acqua calda) setpoint / rele
  _modalita: >-
    {{ 'power_station' if _scelta_surplus == 'power_station' else _tipo_acs }}
  _entita_setpoint: !input entita_setpoint
  _entita_rele_acs: !input entita_rele_acs
  _entita_rele_ps: !input entita_rele_ps
  _controllo_ps: !input controllo_ps
  # Il relè da comandare dipende dalla modalità scelta. La presa di
  # backup della Solarbank non è ancora controllabile: in quel caso
  # nessun relè, e l'attivazione produce una notifica dedicata.
  _rele_attivo: >-
    {% if _modalita == 'rele' %} {{ _entita_rele_acs }}
    {% elif _modalita == 'power_station' and _controllo_ps == 'smart_plug' %} {{ _entita_rele_ps }}
    {% else %} {{ '' }}
    {% endif %}
  # Comando risultante da questo trigger: 'on', 'off' o nessuno
  _comando: >-
    {% if trigger.id == 'on' %} on
    {% elif trigger.id in ['off', 'prelievo', 'guasto', 'ps_piena'] %} off
    {% elif trigger.id == 'tramonto' %} off
    {% else %} none
    {% endif %}

actions:
  - choose:
      # ----- Blocco con avviso: la Solarbank non può alimentare il carico -----
      - conditions:
          - condition: trigger
            id: "on"
          - condition: template
            value_template: "{{ _p_max_attuale | float < _p_carico | float }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚠️ Surplus Solare: attivazione bloccata"
              message: >-
                La potenza massima erogabile dalla Solarbank
                ({{ _p_max_attuale | round(0) }} W) è inferiore
                all'assorbimento del carico ({{ _p_carico }} W).
                Verifica il valore "Potenza massima erogabile" nel
                blueprint e il limite di uscita impostato nell'app Anker
                (es. modalità 800 W), o correggi il valore del carico.
              notification_id: surplus_solare_p_max_warning

      # ----- ATTIVAZIONE -----
      - conditions:
          - condition: template
            value_template: "{{ _comando | trim == 'on' }}"
          - condition: template
            value_template: "{{ is_state('sun.sun', 'above_horizon') }}"
        sequence:
          - choose:
              # ACS — setpoint su pompa di calore / boiler smart
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ _modalita == 'setpoint'
                         and _entita_setpoint.startswith('water_heater.') }}
                sequence:
                  - action: water_heater.set_temperature
                    target:
                      entity_id: !input entita_setpoint
                    data:
                      temperature: !input temp_surplus
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ _modalita == 'setpoint'
                         and _entita_setpoint.startswith('climate.') }}
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: !input entita_setpoint
                    data:
                      temperature: !input temp_surplus
              # Power station via presa di backup — non ancora supportato
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ _modalita == 'power_station'
                         and _controllo_ps == 'presa_backup' }}
                sequence:
                  - action: persistent_notification.create
                    data:
                      title: "⚠️ Surplus Solare: presa di backup non ancora supportata"
                      message: >-
                        Hai scelto il controllo della ricarica tramite la
                        presa di backup della Solarbank, ma l'integrazione
                        ufficiale non ne consente ancora il controllo da
                        Home Assistant. Per ora collega il caricatore a una
                        smart plug o a un relè smart e seleziona quella
                        opzione nel blueprint. Quando la funzione sarà
                        disponibile, richiederà anche la Solarbank in
                        modalità "Controllo di terze parti".
                      notification_id: surplus_solare_backup_warning
              # ACS resistenza o Power station — accensione relè
              - conditions:
                  - condition: template
                    value_template: "{{ _rele_attivo | trim != '' }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id: "{{ _rele_attivo | trim }}"
            default:
              - action: persistent_notification.create
                data:
                  title: "⚠️ Surplus Solare: configurazione incompleta"
                  message: >-
                    La modalità selezionata è "{{ _modalita }}" ma l'entità
                    corrispondente non è configurata (o non è del tipo
                    corretto). Apri il blueprint e completa la sezione
                    relativa alla modalità scelta.
                  notification_id: surplus_solare_config_warning

      # ----- DISATTIVAZIONE (fine surplus / prelievo / tramonto / guasto) -----
      - conditions:
          - condition: template
            value_template: "{{ _comando | trim == 'off' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ _modalita == 'setpoint'
                         and _entita_setpoint.startswith('water_heater.') }}
                sequence:
                  - action: water_heater.set_temperature
                    target:
                      entity_id: !input entita_setpoint
                    data:
                      temperature: !input temp_standard
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ _modalita == 'setpoint'
                         and _entita_setpoint.startswith('climate.') }}
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: !input entita_setpoint
                    data:
                      temperature: !input temp_standard
              - conditions:
                  - condition: template
                    value_template: "{{ _rele_attivo | trim != '' }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ _rele_attivo | trim }}"

  # ----- Notifica in caso di spegnimento per sensori non disponibili -----
  - if:
      - condition: trigger
        id: "guasto"
    then:
      - action: persistent_notification.create
        data:
          title: "⚠️ Surplus Solare: sensori non disponibili"
          message: >-
            Uno o più sensori della Solarbank sono rimasti non disponibili
            per oltre 10 minuti (possibile caduta della connessione Modbus
            locale). Il carico è stato riportato allo stato di riposo per
            sicurezza. Verifica l'integrazione Anker SOLIX Official.
          notification_id: surplus_solare_guasto_warning
